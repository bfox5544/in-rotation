[project]
name = "in-rotation-data"
version = "0.5.0"
description = "In Rotation offline data jobs (recs: recommendation engine; ingest: MusicBrainz catalog)."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "pyarrow>=15", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recs", "ingest"]
