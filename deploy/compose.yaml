# The deployed stack (M9, ADR 0025). From the repo root on the server:
#   docker compose -f deploy/compose.yaml up -d --build
# Settings and secrets: deploy/.env (copy deploy/.env.example). Steps: docs/deploy.md.
name: inrotation

x-api: &api
  image: inrotation-api:latest
  env_file: ${ENV_FILE:-.env}     # deploy/.env (ENV_FILE only for local test runs)
  environment:
    INROTATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  migrate:                       # runs `alembic upgrade head`, then exits. The API waits for it.
    <<: *api
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    command: ["alembic", "upgrade", "head"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  api:
    <<: *api
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/inrotation/data/current}:/data:ro    # model, catalog.db, album_map.json (deploy/install-data.sh)
      - ${COVERS_DIR:-/srv/inrotation/covers}:/covers           # cover cache, written on first view of a cover
      - ${AVATARS_DIR:-/srv/inrotation/avatars}:/avatars        # profile pictures
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: {VITE_CONTACT_EMAIL: "${VITE_CONTACT_EMAIL:-}"}
    image: inrotation-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      CADDY_TLS: ${CADDY_TLS:-origin_cert}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ${CERTS_DIR:-/srv/inrotation/certs}:/certs:ro
      - caddy_data:/data
    depends_on: {api: {condition: service_healthy}}

  jobs:                          # nightly backups and anonymous-user cleanup (deploy/jobs.sh)
    <<: *api
    command: ["inrotation-jobs"]
    restart: unless-stopped
    environment:
      INROTATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ${BACKUPS_DIR:-/srv/inrotation/backups}:/backups
      - ${AVATARS_DIR:-/srv/inrotation/avatars}:/avatars:ro
    depends_on: {migrate: {condition: service_completed_successfully}}

volumes:
  pgdata:
  caddy_data:
